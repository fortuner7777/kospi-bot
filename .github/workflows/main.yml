name: Daily KOSPI Predict Bot

on:
  schedule:
    # 한국 시간(KST) 오전 8시 30분 = 세계표준시(UTC) 전날 밤 23시 30분
    # 월~금(1-5) 평일에만 작동하도록 설정
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # 수동으로 테스트해볼 수 있는 버튼 생성

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3
      
    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance pykrx requests
        
    - name: 파이썬 스크립트 실행
      run: python main.py
