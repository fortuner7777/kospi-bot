name: Daily KOSPI Predict Bot

on:
  schedule:
    # 한국 시간(KST) 오전 8시 23분 실행 (트래픽 회피)
    # = UTC 시간 일~목 밤 23시 23분
    - cron: '23 23 * * 0-4'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3
      
    - name: 파이썬 환경 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance pykrx requests
        
    - name: 파이썬 스크립트 실행
      run: python main.py
